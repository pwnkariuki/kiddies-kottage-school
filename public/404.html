<html lang="en">

    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback: remember the requested path, then load the app.
      sessionStorage.setItem("kk_redirect_path", location.pathname + location.search);
      location.replace("/");
    </script>
